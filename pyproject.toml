[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanocrawl"
version = "0.1.0"
description = "A polite, concurrent web crawler that turns a site into a clean text corpus."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Akarsh Sabharwal" }]
keywords = ["crawler", "spider", "asyncio", "web-scraping", "corpus", "information-retrieval"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

# One dependency: an async HTTP client. Parsing, robots.txt, hashing and the
# scheduler are all standard library.
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "ruff>=0.4",
  "mypy>=1.9",
]

[project.scripts]
nanocrawl = "nanocrawl.cli:main"

[tool.setuptools.packages.find]
include = ["nanocrawl*"]

[tool.setuptools.package-data]
nanocrawl = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RET", "ARG", "N", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.mypy]
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["nanocrawl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
markers = ["slow: longer-running tests"]
